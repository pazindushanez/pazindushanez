name: Update Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Fixed: Now runs exactly once every 12 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4 # Fixed: Reverted to the correct stable version

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=gotham&hide_border=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push activity-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4 
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
