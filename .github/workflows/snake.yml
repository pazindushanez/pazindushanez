name: Generate Snake v2

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-24.04 # Pinned to 24.04 to clear the Ubuntu migration notice
    timeout-minutes: 10
    
    # REQUIRED: Gives the action permission to push files back to your repo (fixes error 128)
    permissions:
      contents: write 

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          # Automatically uses your correct handle (pazindu-shane)
          github_user_name: ${{ github.repository_owner }} 
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4 # Updated to v4 to clear Node.js 20 deprecation
        with:
          target_branch: output # Changed to 'output' so it doesn't overwrite your main branch files
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
